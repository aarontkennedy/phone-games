# Monthly dependency check (docs/SECURITY.md). One grouped pull request per ecosystem;
# CI runs every test on it. New releases wait a week, so hijacked versions get pulled first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
    ignore:
      # Vite 8 requires lightningcss, which is MPL-2.0 (not allowed: docs/LEGAL.md).
      - dependency-name: vite
        versions: ['>=8']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
